services:
  nginx:
    image: nginx:stable
    container_name: riyan-compose-nginx
    environment:
      APP_ENV: production
      APP_NAME: riyan-nginx
    ports:
      - "8083:80"
    volumes:
      - /home/ubuntu/riyan-docker-task/nginx-site:/usr/share/nginx/html:ro
    restart: unless-stopped

  digital-studio:
    image: httpd:2.4
    container_name: riyan-compose-studio
    environment:
      APP_ENV: production
      APP_NAME: riyan-studio
    ports:
      - "8084:80"
    volumes:
      - /home/ubuntu/riyan-project/digital-studio:/usr/local/apache2/htdocs:ro
    restart: unless-stopped
